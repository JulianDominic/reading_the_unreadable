# Manifests and annotations from the pipeline output, plus the Mirador viewer.
server {
    listen 8000;
    server_name _;
    root /srv/iiif;

    # Mirador and other IIIF clients load these cross-origin
    add_header Access-Control-Allow-Origin "*" always;
    # Pages are added and re-run while the server is up; make browsers revalidate every time
    add_header Cache-Control "no-cache" always;

    types {
        application/ld+json json;
        text/html html;
        application/javascript js;
        image/jpeg jpg;
        text/plain txt;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/ld+json text/plain;

    location = / {
        return 302 /viewer.html;
    }

    location ~ ^/(viewer\.html|mirador\.min\.js|mirador-fixes\.js|find\.js)$ {
        root /srv/viewer;
    }

    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }
}
